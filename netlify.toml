[functions]
  node_bundler = "esbuild"

# Scheduled Function: рассылка напоминаний тем, кто не сдал сегодняшнюю миссию Лео.
# Запускается КАЖДЫЙ ЧАС — а внутри send-reminders.js сама решает, кому сейчас
# подходящее время (каждый пользователь выбирает своё время в настройках, по умолчанию 20:00).
[functions."send-reminders"]
  schedule = "0 * * * *"
