[functions]
  node_bundler = "esbuild"

# Scheduled Function: рассылка напоминаний тем, кто не сдал сегодняшнюю миссию Лео.
# Расписание в UTC, cron-формат. Пример ниже — каждый день в 15:00 UTC (18:00 в Бишкеке).
# Поменяй на "0 * * * *", если хочешь ежечасно (как обсуждали).
[functions."send-reminders"]
  schedule = "0 15 * * *"
